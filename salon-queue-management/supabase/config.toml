project_id = "salonq"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://127.0.0.1:5174", "http://localhost:5173", "http://localhost:5174"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# This enables the email provider. Global auth.enable_signup=false blocks new users.
# Setting this false also disables provisioned staff password sign-in.
enable_signup = true
enable_confirmations = true

[functions.salonq-api]
# Public/capability operations are intentional. Staff JWTs are explicitly validated.
# Publishable/secret API keys are not JWTs; do not pretend the gateway validates them as JWTs.
verify_jwt = false

[db.seed]
enabled = false
